# How often our high-confidence picks really win, by sport, market and
# league, and how often the day's top-N picks would have landed together
# (backend/confidence_check.py). Runs after the nightly training and
# calibration; the report is kept in Redis (betiq:confidence_check).
name: Confidence check

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/confidence_check.py"
      - ".github/workflows/confidence-check.yml"

concurrency:
  group: confidence-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/redis-tunnel
        with:
          host: ${{ secrets.VM_HOST }}
          key: ${{ secrets.REDIS_TUNNEL_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Confidence check
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python confidence_check.py
