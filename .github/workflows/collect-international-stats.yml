# Nightly data for the models, into Upstash Redis:
# 1. International matches' corners and cards (ESPN, topped up by
#    API-Football), then a test of the international corners/bookings
#    model — backend/collect_international_stats.py.
# 2. European competitions and domestic cups (ESPN) for the club model,
#    with a weekly check that they improve its league predictions —
#    backend/collect_club_cups.py.
# The first runs backfill history; after that each run adds the latest
# matches. Needs the UPSTASH_REDIS_URL secret (same as Render);
# APIFOOTBALL_KEY is optional.
name: Collect international stats

on:
  schedule:
    - cron: "30 2 * * *"   # daily, before "Train model"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of international collection"
        default: "60"
      cup_minutes:
        description: "Minutes of European/cup collection"
        default: "100"
      probe:
        description: "Only show what ESPN returns per European/cup competition"
        type: boolean
        default: false

concurrency:
  group: collect-international-stats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Collect and test
        if: github.event.inputs.probe != 'true'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          INTL_STATS_MINUTES: ${{ github.event.inputs.minutes || '60' }}
        run: python collect_international_stats.py

      # European competitions and domestic cups for the club model, then a
      # weekly check that they improve its league predictions (club_cups.py)
      - name: Collect club cups and test
        if: github.event.inputs.probe != 'true'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          CLUB_CUPS_MINUTES: ${{ github.event.inputs.cup_minutes || '100' }}
        run: python collect_club_cups.py

      - name: Probe ESPN (European/cup competitions)
        if: github.event.inputs.probe == 'true'
        run: python collect_club_cups.py --probe
