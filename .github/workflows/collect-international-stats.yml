# Collects corners and cards for international matches (SofaScore, topped
# up by API-Football) into Upstash Redis, then tests the international
# corners/bookings model on them — see backend/collect_international_stats.py.
# The first runs backfill history a chunk at a time; after that each run
# only adds the latest matches. Needs the UPSTASH_REDIS_URL secret (same as
# Render); APIFOOTBALL_KEY is optional.
name: Collect international stats

on:
  schedule:
    - cron: "30 2 * * *"   # daily, before "Train model"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of SofaScore collection"
        default: "150"

concurrency:
  group: collect-international-stats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Collect and test
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          INTL_STATS_MINUTES: ${{ github.event.inputs.minutes || '150' }}
        run: python collect_international_stats.py
