# SportyBet's weekly jackpot (backend/jackpot.py): this week's matches with
# our chances, the best ticket for each number of lines, the chance of each
# prize, and how past weeks' favourites (and our picks) did. Thursday and
# Friday before the Saturday deadline, and by hand.
name: Jackpot

on:
  schedule:
    - cron: "17 9 * * 4,5"
  workflow_dispatch:
    inputs:
      history:
        description: "Past weeks to fetch and score"
        default: "20"

concurrency:
  group: jackpot
  cancel-in-progress: true

jobs:
  jackpot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/redis-tunnel
        with:
          host: ${{ secrets.VM_HOST }}
          key: ${{ secrets.REDIS_TUNNEL_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Jackpot
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          HISTORY: ${{ inputs.history || '20' }}
        run: python jackpot.py --history "$HISTORY"
