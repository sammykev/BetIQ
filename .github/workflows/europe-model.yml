# The European competitions model (backend/europe_model.py): weekly, collect
# the small domestic leagues ESPN carries (collect_club_cups.py --leagues), replay
# the last season of Champions, Europa and Conference League matches through
# each way of adding the extra leagues (Belgium, Scotland, Greece, Turkey,
# Austria, Switzerland, Denmark, Norway, Sweden, Poland, Romania) and league
# strength; adopt one only if it beats the main model on those matches, then
# train and publish it. "Train model" keeps it fresh nightly after that.
# Needs the UPSTASH_REDIS_URL secret (same as Render).
name: Europe model

on:
  schedule:
    - cron: "15 5 * * 1"   # Mondays, after the nightly collection and training
  workflow_dispatch:
    inputs:
      probe:
        description: "Only list which ESPN leagues answer (for clubs we have no league data for)"
        type: boolean
        default: false
      league_minutes:
        description: "Minutes of ESPN small-league collection before the check"
        default: "45"

concurrency:
  group: europe-model
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/redis-tunnel
        with:
          host: ${{ secrets.VM_HOST }}
          key: ${{ secrets.REDIS_TUNNEL_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Cyprus, Ireland, Israel, Malta, Wales, Northern Ireland, Czechia,
      # Finland from ESPN (club_cups.LEAGUES): the first runs backfill three
      # seasons, later ones add the latest matches
      - name: Collect ESPN leagues
        if: github.event.inputs.probe != 'true'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python collect_club_cups.py --leagues --minutes ${{ github.event.inputs.league_minutes || '45' }}

      - name: Check, then train and publish if adopted
        if: github.event.inputs.probe != 'true'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python europe_model.py

      - name: Probe ESPN leagues
        if: github.event.inputs.probe == 'true'
        run: python europe_model.py --probe-leagues
