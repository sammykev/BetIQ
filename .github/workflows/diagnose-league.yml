# One-off look at a league's live predictions against the published model
# (backend/diagnose_league.py). Run by hand.
name: Diagnose league

on:
  workflow_dispatch:
    inputs:
      league:
        description: "League code (e.g. PL)"
        default: "PL"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/redis-tunnel
        with:
          host: ${{ secrets.VM_HOST }}
          key: ${{ secrets.REDIS_TUNNEL_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Diagnose
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          LEAGUE: ${{ inputs.league }}
        run: python diagnose_league.py "$LEAGUE"
