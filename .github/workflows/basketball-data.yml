# Basketball data (backend/probe_basketball.py): what SportyBet lists and
# which history sources answer from here. Run by hand while basketball is
# being built; the nightly collection joins this workflow once it exists.
name: Basketball data

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "SportyBet match pages to read for markets"
        default: "10"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Probe
        run: python probe_basketball.py --pages ${{ github.event.inputs.pages || '10' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basketball-probe
          path: backend/basketball_probe.json
          if-no-files-found: ignore
