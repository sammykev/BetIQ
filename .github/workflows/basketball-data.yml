# Basketball data:
# - Nightly: the walk-forward check (backend/backtest_basketball.py) on the
#   results the API server collects from SportyBet into Upstash Redis. Its
#   per-league spread correction is picked up by the server's next rating.
# - By hand: the probe (backend/probe_basketball.py) — what SportyBet lists
#   and which history sources answer from here.
# Needs the UPSTASH_REDIS_URL secret (same as the server).
name: Basketball data

on:
  schedule:
    - cron: "10 3 * * *"   # daily
  workflow_dispatch:
    inputs:
      job:
        description: "backtest, elo_check, insights, fair_odds, football_blend, market_blend, basketball_blend, clubs, crests, ticket_review, market_calibration, edge_check, bb_quarters, calibration, tickets, site, scores, scores_fix, europe, europe_probe, europe_stored, sb_leagues (minutes: how long), extra_leagues, pending, team_news, sentry, history (10 seasons of games), history_sample, props, props_sample, probe, or read_probe (the server's web probe)"
        default: "backtest"
      minutes:
        description: "props: minutes of collection"
        default: "80"
      pages:
        description: "Probe: SportyBet match pages to read for markets"
        default: "10"
      parts:
        description: "Probe: only these parts (comma-separated; empty: all)"
        default: ""

concurrency:
  group: basketball-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/redis-tunnel
        with:
          host: ${{ secrets.VM_HOST }}
          key: ${{ secrets.REDIS_TUNNEL_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      # Player box scores for player props (props_collect.py): new games each night
      - name: Player box scores
        if: github.event_name == 'schedule' || github.event.inputs.job == 'props'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python props_collect.py --minutes ${{ github.event.inputs.minutes || '60' }}
      - name: Player props walk-forward check
        if: github.event_name == 'schedule' || github.event.inputs.job == 'props'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python props_backtest.py
      - name: Player box scores (sample, saves nothing)
        if: github.event.inputs.job == 'props_sample'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python props_collect.py --sample

      # Ten seasons of games from before SportyBet's results (bb_history.py); resumes each run
      - name: Basketball history
        if: github.event.inputs.job == 'history'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python bb_history.py --minutes ${{ github.event.inputs.minutes || '100' }}
      - name: Basketball history (sample, saves nothing)
        if: github.event.inputs.job == 'history_sample'
        run: python bb_history.py --sample

      # How much Elo (basketball_elo.py) each league's margins should take
      # (walk-forward); the server and the walk-forward check below use it
      - name: Basketball Elo check
        if: github.event_name == 'schedule' || github.event.inputs.job == 'elo_check' || github.event.inputs.job == 'backtest' || github.event.inputs.job == 'history'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python elo_check_basketball.py

      - name: Walk-forward check
        if: github.event_name == 'schedule' || github.event.inputs.job == 'backtest' || github.event.inputs.job == 'history'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python backtest_basketball.py

      # What our right and wrong predictions have in common (insights.py)
      - name: Prediction insights
        if: github.event.inputs.job == 'insights'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python insights.py

      # De-vig methods and our ratings' weight against SportyBet's winner
      # prices, on settled tennis, table tennis and basketball matches
      - name: Fair odds check
        if: github.event.inputs.job == 'fair_odds' || github.event.inputs.job == 'insights'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python check_fair_odds.py

      # Football markets' calibration maps (also nightly in "Train model")
      - name: Football calibration
        if: github.event.inputs.job == 'calibration'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python football_calibration.py

      # Why ticket legs are still pending (ticket_check.py; reads only)
      - name: Ticket check
        if: github.event.inputs.job == 'tickets'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python ticket_check.py

      # Is the site loading? Every page's endpoints, timed (site_check.py; reads only)
      - name: Site check
        if: github.event.inputs.job == 'site'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python site_check.py

      # Are the stored football scores right? Ours vs ESPN and SportyBet (score_check.py; reads only)
      - name: Score check
        if: github.event.inputs.job == 'scores'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python score_check.py

      # Why ticket legs and daily picks are still pending after their match (pending_check.py; reads only)
      - name: Pending legs check
        if: github.event.inputs.job == 'pending'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python pending_check.py

      # Europa / Conference League fixtures ESPN has (europe_check.py; reads only)
      - name: Europe fixtures check
        if: github.event.inputs.job == 'europe'
        run: python europe_check.py

      # Wider European league data: ClubElo, API-Football's leagues and quota, SportyBet's results depth
      - name: Europe data probe
        if: github.event.inputs.job == 'europe_probe' || github.event.inputs.job == 'europe_stored'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          UPSTASH_REDIS_URL: ${{ github.event.inputs.job == 'europe_stored' && secrets.UPSTASH_REDIS_URL || '' }}
        run: python europe_data_probe.py

      # Top flights of the European countries no other source covers, from SportyBet's
      # results (collect_sb_leagues.py): nightly a few minutes; by hand, the backfill
      - name: SportyBet leagues
        if: github.event_name == 'schedule' || github.event.inputs.job == 'sb_leagues'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python collect_sb_leagues.py --minutes ${{ github.event.inputs.job == 'sb_leagues' && github.event.inputs.minutes || '10' }}

      # Repair: ESPN's final on every match a weaker source scored wrong (last 14 days);
      # the server then grades those tickets again
      - name: Score fix
        if: github.event.inputs.job == 'scores_fix'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python score_check.py --fix

      # Football: do our predictions hold up in Belgium, Scotland, Greece, Turkey and the
      # other leagues we publish from ESPN? Saves which pass (check_extra_leagues.py)
      - name: Extra leagues check
        if: github.event.inputs.job == 'extra_leagues'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python check_extra_leagues.py

      # Football: do xG and the starting XI beat goals-only ratings? (check_team_news.py)
      - name: Team news check
        if: github.event.inputs.job == 'team_news'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python check_team_news.py

      # Error tracking on, without logging in to the server: the SENTRY_DSN
      # secret into Redis, plus a test event (sentry_setup.py)
      - name: Sentry
        if: github.event.inputs.job == 'sentry'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: python sentry_setup.py

      # Football: our chances against blends with the market's prices (check_football_blend.py)
      - name: Football blend check
        if: github.event_name == 'schedule' || github.event.inputs.job == 'football_blend'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python check_football_blend.py

      # Every other football market against SportyBet's prices; saves the weights the server uses (check_market_blend.py)
      - name: Market blend check
        if: github.event_name == 'schedule' || github.event.inputs.job == 'market_blend'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python check_market_blend.py

      # Basketball: our margin/total's weight against SportyBet's lines (check_basketball_blend.py)
      - name: Basketball blend check
        if: github.event_name == 'schedule' || github.event.inputs.job == 'basketball_blend'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python check_basketball_blend.py

      # Football fixture clubs the model has no history for, with the closest known names (club_check.py)
      - name: Club check
        if: github.event.inputs.job == 'clubs'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python club_check.py

      # Which crest each football club gets, and the static ids checked against the fixtures' own (crest_check.py)
      - name: Crest check
        if: github.event.inputs.job == 'crests'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python crest_check.py

      # Every ticket on the site: win rates by market, sport, line and the chance we gave (ticket_review.py);
      # nightly, as the bet slip's honest chance reads it (/api/slip-reliability)
      - name: Ticket review
        if: github.event_name == 'schedule' || github.event.inputs.job == 'ticket_review'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python ticket_review.py

      # Every market's correction, all sports, checked on later picks (calibration.py)
      - name: Market calibration
        if: github.event.inputs.job == 'market_calibration'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python calibration.py

      # How picks do when we disagree with SportyBet, by how far (edge_check.py)
      - name: Edge check
        if: github.event.inputs.job == 'edge_check'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python edge_check.py

      # Quarter markets: do team trends and meetings beat the league pattern? Walk-forward (check_bb_quarters.py)
      - name: Basketball quarters check
        if: github.event_name == 'schedule' || github.event.inputs.job == 'bb_quarters'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python check_bb_quarters.py

      # The production server's own probe (web_probe.py), read back from Redis
      - name: Read the server's probe
        if: github.event.inputs.job == 'read_probe'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: |
          python - <<'PY'
          import json, os, redis
          r = redis.from_url(os.environ["UPSTASH_REDIS_URL"])
          print("Server boot:", r.get("betiq:server:boot"))
          print("Basketball status:", (r.get("betiq:bb:status") or b"")[:300])
          print("Match-day keys:", sorted(k.decode() for k in r.scan_iter("betiq:*md:*", count=1000))[-12:])
          raw = r.get("betiq:probe:web")
          print(json.dumps(json.loads(raw), indent=1)[:200000] if raw else "No probe saved yet")
          import basketball_data as bd
          for key in ("betiq:tennis:results", "betiq:table_tennis:results"):
              days = sorted(k.decode() for k in r.hkeys(key))
              total = sum(len(bd.decode(r.hget(key, d))) for d in days[-3:]) if days else 0
              print(f"\n{key}: {len(days)} days stored ({days[:1]}..{days[-1:]}); last 3 days {total} matches")
              if days:
                  for m in bd.decode(r.hget(key, days[-2] if len(days) > 1 else days[-1]))[:5]:
                      print("  ", m)
          # Live scores: per sport and day, statuses, the newest score written, and started matches still unscored
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          print("Now (UTC):", now.isoformat(timespec="seconds"))
          print("Server boot:", (r.get("betiq:server:boot") or b"")[:120])
          pc = r.get("betiq:predictions")
          if pc:
              preds = json.loads(pc).get("predictions", [])
              by = {}
              for p in preds:
                  by[p.get("date")] = by.get(p.get("date"), 0) + 1
              print("Predictions cache: updated", json.loads(pc).get("last_updated"), "by date", dict(sorted(by.items())[:6]), "TTL", r.ttl("betiq:predictions"))
          # Payload sizes: the home page's predictions, and what makes them big
          import gzip as _gz
          if pc:
              print(f"Predictions payload: {len(preds)} predictions, {len(pc)/1e6:.2f} MB raw, {len(_gz.compress(pc))/1e6:.2f} MB gzipped")
              sizes = {}
              for p in preds:
                  for k, v in p.items():
                      sizes[k] = sizes.get(k, 0) + len(json.dumps(v, separators=(",", ":")))
              print("Biggest fields:", [(k, f"{n/1e3:.0f} KB") for k, n in sorted(sizes.items(), key=lambda x: -x[1])[:15]])
          for k in ("betiq:perf",):
              v = r.get(k)
              print("Server timings:", v.decode()[:6000] if v else "none yet")
          # Football snapshot dry run on the real predictions (saves nothing): which prediction breaks it
          import matchday, traceback
          if pc:
              for d in sorted({p.get("date") for p in preds if p.get("date")}):
                  day = json.loads(r.get(f"betiq:md:{d}") or "{}")
                  for p in [p for p in preds if p.get("date") == d and p.get("sport") in (None, "football")]:
                      try:
                          matchday.merge_predictions(day, [p], now)
                      except Exception:
                          print("SNAPSHOT FAILS on", d, p.get("home"), "v", p.get("away"))
                          print(traceback.format_exc()[-1500:])
                          print("  keys:", sorted(p)[:60])
                  print(f"snapshot dry run {d}: {len(day)} entries; stored key exists: {bool(r.exists(f'betiq:md:{d}'))}")
          for job, rep in sorted(r.hgetall("betiq:live:last").items()):
              print("Live job", job.decode(), rep.decode()[:1500])
          days = [(now.date() - timedelta(days=i)).isoformat() for i in (2, 1, 0)]
          for sport, fmt in (("football", "betiq:md:{d}"), ("basketball", "betiq:bbmd:{d}"),
                             ("tennis", "betiq:tennis:md:{d}"), ("table_tennis", "betiq:table_tennis:md:{d}")):
              for d in days:
                  raw = r.get(fmt.format(d=d))
                  if not raw:
                      print(f"{sport} {d}: nothing stored"); continue
                  day = json.loads(raw)
                  st, last, stuck = {}, "", []
                  for e in day.values():
                      res = e.get("result") or {}
                      s = res.get("status") or "scheduled"
                      st[s] = st.get(s, 0) + 1
                      last = max(last, res.get("at") or "")
                      try:
                          ko = datetime.strptime(f"{e.get('date')} {e.get('time') or '12:00'}", "%Y-%m-%d %H:%M").replace(tzinfo=timezone.utc)
                      except ValueError:
                          continue
                      if s not in ("finished", "postponed") and ko < now - timedelta(minutes=20):
                          stuck.append(f"{e.get('time')} {e.get('home')} v {e.get('away')} [{e.get('league')}] {s} {res.get('minute') or ''}")
                  print(f"{sport} {d}: {len(day)} matches {st}; newest score written {last or 'never'}; started but unfinished {len(stuck)}")
                  for x in stuck[:8]:
                      print("    ", x)
          PY

      - name: Probe
        if: github.event.inputs.job == 'probe'
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python probe_basketball.py --pages ${{ github.event.inputs.pages || '10' }} --parts "${{ github.event.inputs.parts }}"
      - uses: actions/upload-artifact@v4
        if: github.event.inputs.job == 'probe'
        with:
          name: basketball-probe
          path: backend/basketball_probe.json
          if-no-files-found: ignore
