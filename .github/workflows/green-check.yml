# How many picks came in green when the model said 75%+ (or another level),
# and how the booked tickets did (backend/green_check.py). Run by hand.
name: Green check

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Least chance (e.g. 0.75)"
        default: "0.75"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/redis-tunnel
        with:
          host: ${{ secrets.VM_HOST }}
          key: ${{ secrets.REDIS_TUNNEL_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Green check
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          FROM: ${{ inputs.from }}
        run: python green_check.py --from "$FROM"
