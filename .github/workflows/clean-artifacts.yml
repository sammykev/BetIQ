# Actions storage (the account's 0.5 GB) holds every run's artifacts until
# they expire. This deletes those older than a few days, weekly and by hand.
name: Clean artifacts

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: Delete artifacts older than this many days (0 = all)
        default: "3"

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ github.event.inputs.days || '3' }}
        run: |
          cutoff=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | \"\(.id) \(.size_in_bytes) \(.name)\"" > old.txt || true
          n=0; bytes=0
          while read -r id size name; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && n=$((n+1)) && bytes=$((bytes+size))
          done < old.txt
          echo "Deleted $n artifacts, $((bytes/1024/1024)) MB"
