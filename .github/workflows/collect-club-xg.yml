# Past club matches' xG from SofaScore into Upstash Redis
# (backend/collect_club_xg.py) — SofaScore blocks the VPS, so it runs here.
# The first runs backfill four seasons of the CSV leagues; after that each
# run adds the latest matches. Weekly (or on demand with "check"), a
# walk-forward backtest decides whether the goals model uses xG
# (backend/xg_check.py); training reads that verdict.
name: Collect club xG

on:
  schedule:
    - cron: "10 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of collection"
        default: "50"
      check:
        description: "Then run the xG backtest"
        type: boolean
        default: false

concurrency:
  group: collect-club-xg
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/redis-tunnel
        with:
          host: ${{ secrets.VM_HOST }}
          key: ${{ secrets.REDIS_TUNNEL_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Collect xG
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          CLUB_XG_MINUTES: ${{ github.event.inputs.minutes || '50' }}
        run: python collect_club_xg.py

      # Weekly (Sunday's 06:10 UTC run), or when asked
      - name: Backtest xG
        if: github.event.inputs.check == 'true' || github.event_name == 'schedule'
        continue-on-error: true
        timeout-minutes: 120
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$(date -u +%u%H)" != "706" ]; then
            echo "Not this run (weekly: Sunday 06:10 UTC)."
            exit 0
          fi
          python xg_check.py
