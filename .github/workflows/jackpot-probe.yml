# Find SportyBet's weekly jackpot (its API and rules) — backend/probe_jackpot.py.
# Read-only. Run by hand.
name: Jackpot probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Probe
        run: python probe_jackpot.py
