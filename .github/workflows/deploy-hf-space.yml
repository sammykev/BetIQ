# Deploys the API to a Hugging Face Space (needs Hugging Face PRO) on every
# push to main that touches it. Setup: deploy/huggingface/README.md (needs the HF_TOKEN secret
# and the HF_SPACE variable; skipped until HF_SPACE is set).
name: Deploy API to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "data/**"
      - "deploy/huggingface/**"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Assemble the Space
        run: bash deploy/huggingface/build-space.sh _space

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install huggingface_hub
          python deploy/huggingface/upload.py _space
