# What the site leaves out of slips and why, and the SportyBet football we
# don't predict at all with how much history it has (backend/left_out.py).
# Run by hand.
name: Left-out matches

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/redis-tunnel
        with:
          host: ${{ secrets.VM_HOST }}
          key: ${{ secrets.REDIS_TUNNEL_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Report
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: python left_out.py
