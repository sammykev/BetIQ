<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img">
  <title>BetIQ</title>
  <desc>BetIQ football prediction app logo</desc>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="#0f172a"/>

  <!-- Football patches (pentagons) -->
  <polygon points="200,150 224,167 215,196 185,196 176,167" fill="#1e3a5f"/>
  <polygon points="240,130 264,147 255,176 225,176 224,147" fill="#1e3a5f"/>
  <polygon points="235,210 259,227 250,256 220,256 219,227" fill="#1e3a5f"/>
  <polygon points="165,210 189,227 180,256 150,256 149,227" fill="#1e3a5f"/>
  <polygon points="160,130 184,147 175,176 145,176 144,147" fill="#1e3a5f"/>

  <!-- Seam lines -->
  <line x1="200" y1="150" x2="224" y2="167" stroke="#334155" stroke-width="2"/>
  <line x1="224" y1="167" x2="215" y2="196" stroke="#334155" stroke-width="2"/>
  <line x1="215" y1="196" x2="185" y2="196" stroke="#334155" stroke-width="2"/>
  <line x1="185" y1="196" x2="176" y2="167" stroke="#334155" stroke-width="2"/>
  <line x1="176" y1="167" x2="200" y2="150" stroke="#334155" stroke-width="2"/>
  <line x1="200" y1="150" x2="200" y2="100" stroke="#334155" stroke-width="1.5"/>
  <line x1="224" y1="167" x2="264" y2="147" stroke="#334155" stroke-width="1.5"/>
  <line x1="215" y1="196" x2="248" y2="220" stroke="#334155" stroke-width="1.5"/>
  <line x1="185" y1="196" x2="152" y2="220" stroke="#334155" stroke-width="1.5"/>
  <line x1="176" y1="167" x2="136" y2="147" stroke="#334155" stroke-width="1.5"/>

  <!-- Green trend line clipped to ball area -->
  <defs>
    <clipPath id="c">
      <circle cx="200" cy="200" r="140"/>
    </clipPath>
  </defs>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#1e293b" stroke-width="1"/>
  <polyline
    points="100,240 130,222 160,230 195,205 230,188 270,165"
    fill="none"
    stroke="#22c55e"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    clip-path="url(#c)"
  />
  <circle cx="268" cy="166" r="8" fill="#22c55e" clip-path="url(#c)"/>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.7"/>
</svg>
