services:
  - type: web
    name: sport-bet-predictions-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Clerk Frontend API URL (Clerk Dashboard → API keys). Set this to make the
      # user endpoints verify sign-in tokens — see auth.py.
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # SportyBet booking (sportybet.py). Defaults work; set SPORTYBET_PROXY only
      # if the admin "Test live booking" check shows SportyBet refusing this server.
      - key: SPORTYBET_COUNTRY
        value: ng
      - key: SPORTYBET_PROXY
        sync: false
    disk:
      name: csv-data
      mountPath: /data
      sizeGB: 1
