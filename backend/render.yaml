services:
  - type: web
    name: sport-bet-predictions-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Clerk Frontend API URL (Clerk Dashboard → API keys). Set this to make the
      # user endpoints verify sign-in tokens — see auth.py.
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # Clerk user ids allowed into the admin page, comma-separated (the page
      # shows yours). ADMIN_SECRET then only matters for scripts.
      - key: ADMIN_USER_IDS
        sync: false
      # Clerk secret key (Clerk Dashboard → API keys): lets the server check a
      # user's Premium before returning match analysis (require_premium).
      - key: CLERK_SECRET_KEY
        sync: false
      # Shared with Vercel: the site's /api/t route sends page views with it.
      # Optional — without it ADMIN_SECRET is used.
      - key: TRAFFIC_KEY
        sync: false
      # Extra sites allowed to call the API from a browser, comma-separated
      - key: ALLOWED_ORIGINS
        sync: false
      # API-Football (dashboard.api-football.com), same key as the GitHub
      # secret: referees for upcoming matches when SofaScore blocks this server
      - key: APIFOOTBALL_KEY
        sync: false
      # SportyBet booking (sportybet.py). Defaults work; set SPORTYBET_PROXY only
      # if the admin "Test live booking" check shows SportyBet refusing this server.
      # Days ahead to fetch and predict (main.PREDICTION_DAYS)
      - key: PREDICTION_DAYS
        value: "14"
      - key: SPORTYBET_COUNTRY
        value: ng
      - key: SPORTYBET_PROXY
        sync: false
    disk:
      name: csv-data
      mountPath: /data
      sizeGB: 1
